# Desktop installers (Tauri) for Windows, macOS and Linux.
# Manual run: installers as workflow artifacts. Tag v*: the same, plus a GitHub Release published once the three
# systems are built (created as a draft first, so the jobs upload to one release and it never shows half empty).
# Signing is optional: without the secrets (see docs/installers.md) the installers are built unsigned.
name: Desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # tag only: one draft release for the three build jobs to upload to
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="OpenFlyover $GITHUB_REF_NAME" -f body="Desktop installers: see docs/installers.md to install them. Changes: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md" \
            -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # also runs when `release` is skipped (manual run)
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # .exe (NSIS) and .msi
            args: ''
          - platform: macos-latest # one .dmg for Apple Silicon and Intel
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04 # oldest Ubuntu with webkit2gtk-4.1
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: write # uploads the installers to the release

    steps:
      - uses: actions/checkout@v7

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # a universal macOS app is built from both architectures
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Windows signing (https://v2.tauri.app/distribute/sign/windows/): import the PFX into the user's certificate
      # store, then give its thumbprint to Tauri. src-tauri/tauri.windows.conf.json is merged into tauri.conf.json on
      # Windows only; it is written here and never committed. Skipped when the secret is absent.
      - name: Windows certificate (optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output 'Pas de certificat : installeurs non signés.'; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'certificate'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Set-Content -Path "$dir/cert.txt" -Value $env:WINDOWS_CERTIFICATE
          certutil -decode "$dir/cert.txt" "$dir/cert.pfx" | Out-Null
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          # a PFX may also carry its chain: keep the certificate that has the private key
          $cert = Import-PfxCertificate -FilePath "$dir/cert.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item -Recurse -Force $dir
          if (-not $cert) { throw 'Le certificat ne contient pas de clé privée.' }
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } |
            ConvertTo-Json -Depth 4 | Set-Content -Path src-tauri/tauri.windows.conf.json
          Write-Output "Signature avec le certificat $($cert.Subject)"

      # macOS signing and notarization (https://v2.tauri.app/distribute/sign/macos/). Tauri reads these variables;
      # an empty one would still count as set and break the build, so they are exported only when the secrets exist.
      - name: Apple certificate (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo 'Pas de certificat : signature ad hoc seulement.'; exit 0; fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo 'Pas d’identifiant Apple : application signée, non notarisée.'
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # package.json has no "tauri" script (only tauri:dev / tauri:build)
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          # tag push only: empty on a manual run, which builds without a release
          releaseId: ${{ needs.release.outputs.id }}

  # tag only: publish the release once every system uploaded its installers (a failed build leaves it as a draft)
  publish:
    needs: [release, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
