# Checks on pull requests and on master: lint, unit tests and production build with its type check (web job), and the
# Rust tests of the desktop app only when src-tauri or this file changed (rust job: its Linux libraries alone take
# minutes to install). The Rust tests do not use the site, so they build against a placeholder dist/. No end-to-end
# tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      # `tsc -b` type checks both projects (tsconfig.app.json, tsconfig.node.json) before the Vite build: no separate typecheck step
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- src-tauri .github/workflows/ci.yml 2>/dev/null; then
            echo 'rust=false' >> "$GITHUB_OUTPUT"
            echo 'src-tauri inchangé : tests Rust ignorés.'
          else
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: steps.changed.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - if: steps.changed.outputs.rust == 'true'
        run: mkdir -p dist && echo '<!doctype html><title>placeholder</title>' > dist/index.html
      - if: steps.changed.outputs.rust == 'true'
        run: cargo test --locked
        working-directory: src-tauri
