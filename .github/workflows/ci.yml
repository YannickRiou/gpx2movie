# Checks on every push and pull request: types, lint, unit tests, production build, and the Rust tests of the desktop
# app (src-tauri, built against the dist/ just made). No end-to-end tests.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
      # the desktop app's own code (native encoder arguments, command line): Linux libraries of Tauri, then its tests
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --locked
        working-directory: src-tauri
