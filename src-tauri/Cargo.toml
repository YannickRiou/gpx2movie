[package]
name = "openflyover"
version = "0.1.0"
description = "Films de survol 3D à partir de traces GPX et FIT"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# the "_lib" suffix avoids a name clash with the binary on Windows (cargo issue 8519)
name = "openflyover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
